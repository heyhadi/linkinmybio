<style>
  :root { --bg:#fff7ed; --ink:#292018; --org:#ff6b1a; --muted:#8a7a68; --line:#292018; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; display:flex; justify-content:center; padding:56px 20px 48px; }
  main { width:100%; max-width:560px; }
  .mono { width:76px; height:76px; background:var(--org); color:#fff7ed; border-radius:50%;
    font-family:Georgia,serif; font-style:italic; font-size:42px;
    display:flex; align-items:center; justify-content:center; margin:0 auto 22px; }
  h1 { font-size:30px; font-weight:800; text-align:center; letter-spacing:-0.02em; }
  .tag { text-align:center; color:var(--muted); font-size:16px; line-height:1.6; margin:12px auto 38px; max-width:440px; }
  a.card { display:flex; align-items:center; justify-content:space-between; gap:16px;
    background:#ffffff; border:1.5px solid var(--line); border-radius:16px;
    padding:18px 22px; margin-bottom:14px; text-decoration:none; color:var(--ink);
    transition:background .18s ease, color .18s ease, transform .18s ease; }
  a.card:hover, a.card:active { background:var(--org); color:#fff7ed; transform:translateY(-1px); }
  .card .t { font-weight:700; font-size:17px; }
  .card .d { font-size:13.5px; color:var(--muted); margin-top:3px; line-height:1.45; }
  a.card:hover .d { color:#ffe3d1; }
  .card .arr { font-size:20px; flex-shrink:0; }
  footer { text-align:center; color:var(--muted); font-size:13px; margin-top:40px; }
</style>
